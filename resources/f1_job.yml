          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/load/load_bronze.py
            parameters:
              - --path
              - /Volumes/f1/bronze/raw_files/pitstops/season={{job.parameters.season}}
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: load_races
          depends_on:
            - task_key: extract_races
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/load/load_bronze.py
            parameters:
              - --path
              - /Volumes/f1/bronze/raw_files/races
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: load_results
          depends_on:
            - task_key: extract_results
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/load/load_bronze.py
            parameters:
              - --path
              - /Volumes/f1/bronze/raw_files/results
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: load_seasons
          depends_on:
            - task_key: extract_seasons
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/load/load_bronze.py
            parameters:
              - --path
              - /Volumes/f1/bronze/raw_files/seasons
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: load_sprints
          depends_on:
            - task_key: extract_sprints
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/load/load_bronze.py
            parameters:
              - --path
              - /Volumes/f1/bronze/raw_files/sprint
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: transform_constructors_to_silver
          depends_on:
            - task_key: load_constructors
          dbt_task:
            project_directory: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/dbt
            commands:
              - dbt deps
              - dbt seed
              - dbt run --select models/staging/stg_constructors.sql
            schema: silver
            warehouse_id: 22fe6bda0b174cfa
            catalog: f1
            source: WORKSPACE
          environment_key: dbt-default
        - task_key: transform_drivers_to_silver
          depends_on:
            - task_key: load_drivers
          dbt_task:
            project_directory: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/dbt
            commands:
              - dbt deps
              - dbt seed
              - dbt run --select models/staging/stg_drivers.sql

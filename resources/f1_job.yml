resources:
  jobs:
    f1:
      name: f1
      tasks:
        - task_key: extract_constructors
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/extract/extract_file.py
            parameters:
              - --url
              - https://api.jolpi.ca/ergast/f1/{{job.parameters.season}}/constructors.json
              - --target-path
              - constructors/season={{job.parameters.season}}.json
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: extract_drivers
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/extract/extract_file.py
            parameters:
              - --url
              - https://api.jolpi.ca/ergast/f1/{{job.parameters.season}}/drivers.json
              - --target-path
              - drivers/season={{job.parameters.season}}.json
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: extract_races
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/extract/extract_file.py
            parameters:
              - --url
              - https://api.jolpi.ca/ergast/f1/{{job.parameters.season}}/races.json
              - --target-path
              - races/season={{job.parameters.season}}.json
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: extract_laps
          depends_on:
            - task_key: extract_races
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/extract/extract_file_by_round.py
            parameters:
              - --season
              - "{{job.parameters.season}}"
              - --endpoint
              - laps
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: extract_pitstops
          depends_on:
            - task_key: extract_races
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/extract/extract_file_by_round.py
            parameters:
              - --season
              - "{{job.parameters.season}}"
              - --endpoint
              - pitstops
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: extract_results
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/extract/extract_file.py
            parameters:
              - --url
              - https://api.jolpi.ca/ergast/f1/{{job.parameters.season}}/results.json
              - --target-path
              - results/season={{job.parameters.season}}.json
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: extract_seasons
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/extract/extract_file.py
            parameters:
              - --url
              - https://api.jolpi.ca/ergast/f1/seasons.json
              - --target-path
              - seasons/seasons.json
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: extract_sprints
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/extract/extract_file.py
            parameters:
              - --url
              - https://api.jolpi.ca/ergast/f1/{{job.parameters.season}}/sprint.json
              - --target-path
              - sprint/season={{job.parameters.season}}.json
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: load_constructors
          depends_on:
            - task_key: extract_constructors
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/load/load_bronze.py
            parameters:
              - --path
              - /Volumes/f1/bronze/raw_files/constructors
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: load_drivers
          depends_on:
            - task_key: extract_drivers
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/load/load_bronze.py
            parameters:
              - --path
              - /Volumes/f1/bronze/raw_files/drivers
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: load_laps
          depends_on:
            - task_key: extract_laps
          spark_python_task:
            python_file: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/f1_pipeline/load/load_bronze.py

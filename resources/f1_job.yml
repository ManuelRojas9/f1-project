            schema: silver
            warehouse_id: 22fe6bda0b174cfa
            catalog: f1
            source: WORKSPACE
          environment_key: dbt-default
      queue:
        enabled: true
      parameters:
        - name: season
          default: "2026"
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.0,<2.0.0
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED

            - task_key: load_laps
          dbt_task:
            project_directory: /Workspace/Users/manuelmrojas9@gmail.com/f1-project/dbt
            commands:
              - dbt deps
              - dbt seed
              - dbt run --select models/staging/stg_laps.sql
